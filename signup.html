<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Sign Up | CivicAI</title>

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet"
        href="style.css">

</head>


<body class="auth-page">


    <div class="auth-container">


        <a href="index.html"
            class="auth-logo">

            <div class="logo-icon">

                <i data-lucide="building-2"></i>

            </div>

            <span>
                Civic<span class="blue-text">AI</span>
            </span>

        </a>


        <div class="auth-card">


            <div class="auth-header">

                <div class="auth-icon">

                    <i data-lucide="user-plus"></i>

                </div>

                <h1>Create Account</h1>

                <p>
                    Join CivicAI and report public issues easily.
                </p>

            </div>


            <form id="signupForm">


                <div class="auth-group">

                    <label>Full Name</label>

                    <input type="text"
                        id="signupName"
                        placeholder="Enter your full name"
                        required>

                </div>


                <div class="auth-group">

                    <label>Email Address</label>

                    <input type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="auth-group">

                    <label>Password</label>

                    <input type="password"
                        id="signupPassword"
                        placeholder="Minimum 6 characters"
                        required>

                </div>


                <div class="auth-group">

                    <label>Confirm Password</label>

                    <input type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required>

                </div>


                <button type="submit"
                    class="auth-submit-btn">

                    <i data-lucide="user-plus"></i>

                    Create Account

                </button>


                <p class="auth-switch">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>


                <p class="auth-message"
                    id="signupMessage"></p>

            </form>

        </div>


        <a href="index.html"
            class="back-home">

            ← Back to Home

        </a>

    </div>


    <script src="script.js"></script>

    <script>
        lucide.createIcons();
    </script>

</body>

</html>
